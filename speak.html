        .b-btn { background: var(--glass); border: 1px solid var(--neon); color: var(--neon); padding: 8px 15px; border-radius: 12px; font-family: 'Orbitron'; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }

        .view { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .scroll-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px 0 30px; scrollbar-width: none; }
        .scroll-list::-webkit-scrollbar { display: none; }

        .card-sel { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 18px; display: flex; align-items: center; gap: 15px; border-left: 5px solid var(--neon); transition: 0.2s; cursor: pointer; }
        .card-sel:active { transform: scale(0.96); }

        .tier-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 25px; text-align: center; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .tier-card.active { border: 2px solid var(--neon); background: rgba(0, 243, 255, 0.08); box-shadow: 0 0 15px var(--neon); }

        .engine-card { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .main-display { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; padding: 2.5rem 1.2rem; text-align: center; border-top: 4px solid var(--neon); backdrop-filter: blur(10px); }

        .e-native { font-size: 3rem; color: #fff; font-weight: 700; line-height: 1.2; margin-bottom: 15px; word-break: break-word; }
        .e-sub { font-size: 1.1rem; color: var(--neon); font-family: 'Orbitron'; border: 1px solid var(--neon); padding: 8px 30px; border-radius: 50px; display: inline-block; text-transform: uppercase; background: rgba(0,0,0,0.3); }
        .e-mean { font-size: 1.3rem; color: #aaa; display: block; margin-top: 20px; font-weight: 500; letter-spacing: 1px; }

</head>

    let state = { l: '', t: '', i: 0 };

    return {
        init: () => {
            document.getElementById('lang-menu').innerHTML = langs.map(l => `
                <div class="card-sel" style="border-left-color:${l.c}" onclick="Core.selL('${l.id}')">
                    <div style="font-size:1.2rem;">🌐</div>
                    <div style="font-family:Orbitron; font-size:1.1rem; color:${l.c}">${l.n}</div>
                </div>`).join('');
        },
        go: (v) => { [1,2,3].forEach(n => document.getElementById('scr-'+n).classList.add('hidden')); document.getElementById('scr-'+v).classList.remove('hidden'); },
        selL: (id) => { state.l = id; document.getElementById('bg-glow').style.background = db[id].c; document.getElementById('tier-title').innerText = db[id].n.toUpperCase(); Core.go(2); },
        setT: (t) => { state.t = t; document.querySelectorAll('.tier-card').forEach(c => c.classList.remove('active')); document.getElementById('t-'+t).classList.add('active'); },
        start: () => { if(!state.t) { alert("Select Level First!"); return; } state.i = 0; Core.go(3); Core.render(); },
        render: () => {
            const list = db[state.l][state.t];
            const data = list[state.i];
            const color = db[state.l].c;
            
            document.getElementById('out-emoji').innerText = data.e || '✨';
            document.getElementById('out-native').innerText = data.n;
            document.getElementById('out-sub').innerText = data.s;
            document.getElementById('out-mean').innerText = data.m;
            document.getElementById('node-name').innerText = db[state.l].n.toUpperCase();
            
            const btn = document.getElementById('next-btn');
            if (state.i === list.length - 1) {
                btn.innerText = "FINISH MODULE ✅";
                btn.style.background = "#00ff66";
                btn.style.boxShadow = "0 0 20px #00ff66";
            } else {
                btn.innerText = "NEXT ITEM 🧬";
                btn.style.background = "var(--neon)";
                btn.style.boxShadow = "0 0 20px rgba(0,243,255,0.4)";
            }
        },
        next: () => {
            const list = db[state.l][state.t];
            if(state.i >= list.length - 1) { alert("MODULE COMPLETED! 🎉"); Core.go(2); }
            else { state.i++; Core.render(); }
        }
    };
})();
Core.init();
</script>
</body>
</html>
