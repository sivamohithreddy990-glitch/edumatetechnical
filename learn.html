<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magical Intelligence UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00eaff;
            --secondary: #7000ff;
            --bg: #030308;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background-color: var(--bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The "Magical Orb" Background */
        .orb-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 234, 255, 0.2) 0%, rgba(112, 0, 255, 0.1) 50%, transparent 70%);
            filter: blur(60px);
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0.8; }
        }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        header {
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 700;
            margin: 0;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,0.3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: var(--primary);
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* The Grid */
        .card-wrapper {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
        }

        /* Premium Glass Card */
        .card {
            position: relative;
            width: 280px;
            height: 380px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-20px) scale(1.02);
            border-color: var(--primary);
            background: rgba(0, 234, 255, 0.05);
            box-shadow: 0 40px 80px rgba(0, 234, 255, 0.15);
        }

        /* Inner Glow Ring */
        .icon-box {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 35px;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            transition: 0.5s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover .icon-box {
            transform: rotate(-5deg);
            border-color: var(--primary);
            box-shadow: inset 0 0 20px var(--primary);
        }

        .icon-box img {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .title {
            font-size: 1.6rem;
            font-weight: 500;
            color: #fff;
            margin: 0;
        }

        .card:hover .title {
            text-shadow: 0 0 15px var(--primary);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 700px) {
            .card-wrapper { flex-direction: column; align-items: center; gap: 20px; }
            .card { width: 320px; height: 160px; flex-direction: row; padding: 25px; border-radius: 30px; }
            .icon-box { margin-bottom: 0; margin-right: 20px; width: 80px; height: 80px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="orb-container">
        <div class="orb"></div>
    </div>

    <div class="content">
        <header>
            <div class="tagline">Neural Interface v2.0</div>
            <h1>Choose Your Path</h1>
        </header>

        <div class="card-wrapper">
            <div class="card" onclick="nav('aptitude')">
                <div class="icon-box">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Apt">
                </div>
                <p class="title">Aptitude</p>
            </div>

            <div class="card" onclick="nav('reasoning')">
                <div class="icon-box">
                    <img src="https://cdn-icons-png.flaticon.com/512/3062/3062634.png" alt="Reas">
                </div>
                <p class="title">Reasoning</p>
            </div>
        </div>
    </div>

    <script>
        function nav(dest) {
            // High-end exit animation
            document.body.style.transition = '1s';
            document.body.style.transform = 'scale(1.2)';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = dest + ".html";
            }, 600);
        }
    </script>
</body>
</html>
