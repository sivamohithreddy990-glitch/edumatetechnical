<style>
:root{
    --glass:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.18);
    --accent:#00f2ff;
    --grad:linear-gradient(135deg,#00f2ff,#7000ff);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#020205;color:white;font-family:'Inter',sans-serif;
}
header{
    padding:70px 20px 30px;text-align:center;
}
header h1{
    font-family:'Space Grotesk';
    font-size:clamp(30px,7vw,50px);
    background:var(--grad);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 15px #00f2ff50);
}
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:20px;max-width:1000px;margin:auto;padding:20px;
}
.magic-card{
    background:var(--glass);border:1px solid var(--border);
    padding:25px;border-radius:20px;text-align:center;
    cursor:pointer;transition:.25s;font-weight:700;
}
.magic-card:hover{
    transform:translateY(-7px)scale(1.05);border-color:var(--accent);
}

/* CONTENT AREA */
#content-page{display:none;max-width:800px;margin:auto;padding:20px;}
.back-btn{
    background:var(--grad);border:none;padding:12px 30px;
    border-radius:30px;color:black;font-weight:900;cursor:pointer;
}

/* SEARCH BOX */
#search-box{
    width:100%;padding:17px;margin:20px 0 30px;
    border-radius:12px;background:var(--glass);border:1px solid var(--border);
    color:white;
}

/* INFORMATION CARD */
.info-card{
    background:var(--glass);border:1px solid var(--border);
    padding:25px;border-radius:20px;margin-bottom:25px;
    transition:.3s;
}
.info-card:hover{
    border-color:var(--accent);
}

/* LOGO */
.company-logo{
    display:block;width:75px;height:75px;border-radius:50%;
    margin:0 auto 10px;box-shadow:0 0 20px #00eaff55;
}

/* BUTTONS */
.magic-btn{
    display:inline-block;margin-top:12px;padding:12px 26px;
    border-radius:12px;text-decoration:none;font-weight:900;
    color:black;background:var(--grad);
    box-shadow:0 0 15px #00f2ff88,0 0 25px #7000ff66;
    transition:.3s;
}
.magic-btn:hover{
    transform:scale(1.07);
}

/* MORE INFO DROPDOWN */
.more-content{display:none;margin-top:12px;font-size:14px;opacity:.8;}
.more-btn{
    color:#00eaff;font-size:13px;font-weight:700;
    margin-top:10px;cursor:pointer;display:block;
}

/* LIVE TIMER */
.live-update{
    font-size:11px;margin-top:7px;opacity:.7;
}
.live-badge{
    padding:4px 8px;background:#ff0033;color:white;border-radius:20px;
    font-size:10px;font-weight:900;animation:pulse 1s infinite alternate;
}
@keyframes pulse{from{opacity:1;}to{opacity:.4;}}
</style>
</head>

/*=====================
   DISPLAY FUNCTION
======================*/
function show(key){
    document.getElementById("main-dash").style.display="none";
    document.getElementById("main-header").style.display="none";
    document.getElementById("content-page").style.display="block";

    const c = document.getElementById("dynamic-content");
    c.innerHTML = `
        <input id='search-box' placeholder='Search here...' onkeyup='search()'>
        <div id='items'></div>
    `;

    const target = document.getElementById("items");
    
    dataset[key].forEach(item=>{
        const id=item.title.replace(/\s/g,'');

        target.innerHTML += `
        <div class="info-card">
            <img src="${item.logo}" class="company-logo">
            <h2>${item.title}</h2>
            <p><b>${item.role}</b></p>
            <p><b>Salary:</b> ${item.salary}</p>
            <p style="opacity:.7;">${item.info}</p>

            <span class="more-btn" onclick="toggleInfo('${id}')">Show More ▼</span>

            <div id="more-${id}" class="more-content">
                <p><b>Process:</b> ${item.process || '—'}</p>
                <p><b>Eligibility:</b> ${item.branch}</p>
            </div>

            <a href="${item.link}" target="_blank" class="magic-btn">APPLY NOW</a><br>
            <a href="${item.video}" target="_blank" class="magic-btn" style="margin-top:10px;background:linear-gradient(135deg,#00ff6a,#0080ff);">WATCH VIDEO</a>

            <div class="live-update" id="t-${id}"></div>
        </div>
        `;

        startTimer(id);
    });
}

/*=====================
   SHOW / HIDE MORE INFO
======================*/
function toggleInfo(id){
    const box=document.getElementById("more-"+id);
    const btn=document.querySelector(`[onclick="toggleInfo('${id}')"]`);
    if(box.style.display=="block"){
        box.style.display="none";
        btn.innerText="Show More ▼";
    } else {
        box.style.display="block";
        btn.innerText="Show Less ▲";
    }
}

/*=====================
   SEARCH
======================*/
function search(){
    let q=document.getElementById("search-box").value.toLowerCase();
    document.querySelectorAll(".info-card").forEach(card=>{
        card.style.display=card.innerText.toLowerCase().includes(q)?"block":"none";
    });
}

/*=====================
   LIVE TIMER
======================*/
function startTimer(id){
    let s=0;
    setInterval(()=>{
        s++;
        document.getElementById("t-"+id).innerHTML=
        `<span class='live-badge'>LIVE</span> Updated ${s}s ago`;
    },1000);
}

/*=====================
   BACK FUNCTION
======================*/
function goHome(){
    document.getElementById("main-dash").style.display="grid";
    document.getElementById("main-header").style.display="block";
    document.getElementById("content-page").style.display="none";
}
