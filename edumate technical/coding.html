<h2 style="color:#008CBA;">CSS Tutorial (Complete Guide)</h2>

<p style="font-size:16px;line-height:1.8;">
CSS (Cascading Style Sheets) is used to style HTML elements, control layouts, colors, fonts, and animations.
CSS works using <b>selectors</b> and <b>properties</b> to apply styles to HTML elements.
</p>

<hr>

<h3 style="color:#333;">1️⃣ CSS Selectors</h3>
<ul>
  <li><b>Element Selector</b> – targets HTML tags (e.g., <code>p { color: red; }</code>)</li>
  <li><b>ID Selector</b> – targets element by ID (e.g., <code>#header { font-size: 20px; }</code>)</li>
  <li><b>Class Selector</b> – targets class (e.g., <code>.menu { background: blue; }</code>)</li>
  <li><b>Group Selector</b> – multiple elements (e.g., <code>h1, h2 { margin: 0; }</code>)</li>
  <li><b>Universal Selector</b> – <code>*</code> selects all elements</li>
  <li><b>Attribute Selector</b> – select elements with specific attributes (e.g., <code>[type="text"]</code>)</li>
  <li><b>Pseudo-classes</b> – <code>:hover, :first-child, :nth-child()</code></li>
  <li><b>Pseudo-elements</b> – <code>::before, ::after</code></li>
  <li><b>Descendant Selector</b> – selects nested elements (e.g., <code>div p</code>)</li>
  <li><b>Child Selector</b> – selects direct children (e.g., <code>div > p</code>)</li>
</ul>

<h2 style="color:#2c7be5;">SQL Tutorial (Complete & Advanced Guide)</h2>

<p style="font-size:16px;line-height:1.9;">
SQL (Structured Query Language) is used to store, retrieve, manipulate, and manage
data in relational database systems such as MySQL, Oracle, SQL Server, and PostgreSQL.
SQL is essential for backend development, data analysis, and database administration.
</p>

<hr>

<h3>1️⃣ SQL Basics</h3>
<ul>
  <li><b>SQL</b> stands for Structured Query Language</li>
  <li>Used to communicate with relational databases</li>
  <li>SQL is <b>not case-sensitive</b></li>
  <li>Common DBMS: MySQL, Oracle, SQL Server, PostgreSQL</li>
</ul>

<h3>2️⃣ Database & Table Commands</h3>
<ul>
  <li><b>CREATE DATABASE</b> – create new database</li>
  <li><b>DROP DATABASE</b> – delete database</li>
  <li><b>USE</b> – select database</li>
  <li><b>CREATE TABLE</b> – create table</li>
  <li><b>DROP TABLE</b> – delete table</li>
  <li><b>TRUNCATE</b> – remove all rows</li>
</ul>

<pre>
CREATE DATABASE school;
USE school;

CREATE TABLE students (
  id INT PRIMARY KEY,
  name VARCHAR(50),
  age INT,
  city VARCHAR(50)
);
</pre>

<h3>3️⃣ Data Types</h3>
<ul>
  <li>INT – integer values</li>
  <li>FLOAT / DOUBLE – decimal numbers</li>
  <li>VARCHAR – text data</li>
  <li>CHAR – fixed length string</li>
  <li>DATE / TIME / DATETIME</li>
  <li>BOOLEAN</li>
</ul>

<h3>4️⃣ INSERT, SELECT, UPDATE, DELETE (DML)</h3>

<pre>
INSERT INTO students VALUES (1, 'John', 21, 'Delhi');
INSERT INTO students VALUES (2, 'Sara', 22, 'Mumbai');

SELECT * FROM students;

UPDATE students
SET age = 23
WHERE name = 'Sara';

DELETE FROM students
WHERE id = 1;
</pre>

<h3>5️⃣ SELECT Query Clauses</h3>
<ul>
  <li>WHERE – filter records</li>
  <li>ORDER BY – sort data</li>
  <li>DISTINCT – remove duplicates</li>
  <li>LIMIT – restrict rows</li>
  <li>AS – alias</li>
</ul>

<pre>
SELECT DISTINCT city FROM students;
SELECT * FROM students WHERE age > 20;
SELECT * FROM students ORDER BY age DESC;
SELECT name AS student_name FROM students;
</pre>

<h3>6️⃣ Operators</h3>
<ul>
  <li>Arithmetic: +, -, *, /</li>
  <li>Comparison: =, !=, &gt;, &lt;, &gt;=, &lt;=</li>
  <li>Logical: AND, OR, NOT</li>
  <li>BETWEEN, IN, LIKE</li>
</ul>

<pre>
SELECT * FROM students WHERE age BETWEEN 20 AND 25;
SELECT * FROM students WHERE city IN ('Delhi','Mumbai');
SELECT * FROM students WHERE name LIKE 'S%';
</pre>

<h3>7️⃣ Aggregate Functions</h3>
<ul>
  <li>COUNT()</li>
  <li>SUM()</li>
  <li>AVG()</li>
  <li>MIN()</li>
  <li>MAX()</li>
</ul>

<pre>
SELECT COUNT(*) FROM students;
SELECT AVG(age) FROM students;
SELECT MAX(age) FROM students;
</pre>

<h3>8️⃣ GROUP BY & HAVING</h3>

<pre>
SELECT city, COUNT(*) 
FROM students
GROUP BY city;

SELECT city, COUNT(*) 
FROM students
GROUP BY city
HAVING COUNT(*) > 1;
</pre>

<h3>9️⃣ SQL Joins</h3>
<ul>
  <li>INNER JOIN</li>
  <li>LEFT JOIN</li>
  <li>RIGHT JOIN</li>
  <li>FULL JOIN</li>
</ul>

<pre>
SELECT students.name, orders.amount
FROM students
INNER JOIN orders
ON students.id = orders.student_id;
</pre>

<h3>🔟 Subqueries</h3>

<pre>
SELECT name FROM students
WHERE age > (SELECT AVG(age) FROM students);
</pre>

<h3>1️⃣1️⃣ Constraints</h3>
<ul>
  <li>PRIMARY KEY</li>
  <li>FOREIGN KEY</li>
  <li>UNIQUE</li>
  <li>NOT NULL</li>
  <li>CHECK</li>
  <li>DEFAULT</li>
</ul>

<h3>1️⃣2️⃣ Indexes & Views</h3>

<pre>
CREATE INDEX idx_name ON students(name);

CREATE VIEW student_view AS
SELECT name, city FROM students;
</pre>

<h3>1️⃣3️⃣ Transactions</h3>
<ul>
  <li>COMMIT</li>
  <li>ROLLBACK</li>
  <li>SAVEPOINT</li>
</ul>

<pre>
START TRANSACTION;
UPDATE students SET age = 25 WHERE id = 2;
ROLLBACK;
</pre>

<h3>1️⃣4️⃣ SQL Functions</h3>

  <li>LENGTH()</li>
  <li>NOW()</li>
  <li>COALESCE()</li>
</ul>

<h3>1️⃣5️⃣ SQL Use Cases</h3>
<ul>
  <li>Backend development</li>

<h2 style="color:#13AA52;">MongoDB Tutorial – Complete Guide with Programs</h2>

<p style="font-size:16px;line-height:1.9;">
MongoDB is a <b>NoSQL, document-oriented database</b> that stores data in flexible,
JSON-like documents called BSON. It is widely used in modern web applications
because of its scalability, performance, and flexibility.
</p>

<hr>

<h3>1️⃣ MongoDB Basics</h3>
<ul>
  <li>NoSQL database (Not Only SQL)</li>
  <li>Data stored as <b>documents</b></li>
  <li>Collections instead of tables</li>
  <li>Schema-less structure</li>
  <li>Uses BSON format</li>
</ul>

<h3>2️⃣ Database & Collection</h3>

<pre>
// Create / switch database
use school
</pre>

<b>Output:</b>
<pre>
switched to db school
</pre>

<pre>
// Create collection
db.createCollection("students")
</pre>

<b>Output:</b>
<pre>
{ "ok" : 1 }
</pre>

<hr>

<h3>3️⃣ Insert Documents</h3>

<pre>
db.students.insertOne({
  name: "John",
  age: 21,
  city: "Delhi"
})

db.students.insertMany([
  { name: "Sara", age: 22, city: "Mumbai" },
  { name: "Amit", age: 21, city: "Delhi" }
])
</pre>

<b>Output:</b>
<pre>
{ "acknowledged" : true, "insertedId" : ObjectId("...") }
</pre>

<hr>

<h3>4️⃣ Find (Read Data)</h3>

<pre>
db.students.find()
</pre>

<b>Output:</b>

<pre>
{ "_id": ObjectId("1"), "name": "John", "age": 21, "city": "Delhi" }
{ "_id": ObjectId("2"), "name": "Sara", "age": 22, "city": "Mumbai" }
{ "_id": ObjectId("3"), "name": "Amit", "age": 21, "city": "Delhi" }
</pre>

<pre>
// Filter
db.students.find({ age: 21 })
</pre>

<b>Output:</b>
<pre>
{ "name": "John", "age": 21, "city": "Delhi" }
{ "name": "Amit", "age": 21, "city": "Delhi" }
</pre>

<hr>

<h3>5️⃣ Projection (Select Fields)</h3>

<pre>
db.students.find({}, { name: 1, city: 1, _id: 0 })
</pre>

<b>Output:</b>
<pre>
{ "name": "John", "city": "Delhi" }
{ "name": "Sara", "city": "Mumbai" }
{ "name": "Amit", "city": "Delhi" }
</pre>

<hr>

<h3>6️⃣ Update Documents</h3>

<pre>
db.students.updateOne(
  { name: "Sara" },
  { $set: { age: 23 } }
)
</pre>

<b>Output:</b>
<pre>
{ "acknowledged": true, "matchedCount": 1, "modifiedCount": 1 }
</pre>

<hr>

<h3>7️⃣ Delete Documents</h3>

<pre>
db.students.deleteOne({ name: "Amit" })
</pre>

<b>Output:</b>
<pre>
{ "acknowledged": true, "deletedCount": 1 }
</pre>

<hr>

<h3>8️⃣ Query Operators</h3>

<pre>
// Greater than
db.students.find({ age: { $gt: 21 } })

// IN operator
db.students.find({ city: { $in: ["Delhi", "Mumbai"] } })
</pre>

<b>Output:</b>
<pre>
{ "name": "Sara", "age": 23, "city": "Mumbai" }
</pre>

<hr>

<h3>9️⃣ Sorting & Limiting</h3>

<pre>
// Sort by age descending
db.students.find().sort({ age: -1 })

// Limit results
db.students.find().limit(2)
</pre>

<hr>

<h3>🔟 Aggregation Framework</h3>

<pre>
db.students.aggregate([
  { $group: { _id: "$city", total: { $sum: 1 } } }
])
</pre>

<b>Output:</b>
<pre>
{ "_id": "Delhi", "total": 1 }
{ "_id": "Mumbai", "total": 1 }
</pre>

<hr>

<h3>1️⃣1️⃣ Indexes</h3>

<pre>
db.students.createIndex({ name: 1 })
</pre>

<b>Output:</b>
<pre>
{ "createdCollectionAutomatically" : false, "numIndexesBefore" : 1 }
</pre>

<hr>

<h3>1️⃣2️⃣ MongoDB vs SQL</h3>
<ul>
  <li>Table → Collection</li>
  <li>Row → Document</li>
  <li>Column → Field</li>
  <li>JOIN → Embedded documents / Lookup</li>
</ul>

<hr>

<h3>1️⃣3️⃣ Real-Time Uses</h3>
<ul>
  <li>Web & mobile apps</li>

  <li>IoT systems</li>

<h2 style="color:#C74634;">Oracle Database & PL/SQL Tutorial – Complete Guide</h2>

<p style="font-size:16px;line-height:1.9;">
Oracle Database is a powerful <b>enterprise-level relational database management system (RDBMS)</b>.
PL/SQL (Procedural Language / SQL) is Oracle’s procedural extension to SQL,
used to write complex logic, stored procedures, functions, and triggers.
</p>

<hr>

<h3>1️⃣ Oracle Basics</h3>
<ul>
  <li>Oracle is an enterprise RDBMS</li>
  <li>Uses SQL for data manipulation</li>
  <li>Uses PL/SQL for procedural programming</li>
  <li>Highly secure, scalable, and reliable</li>
  <li>Used in banking, finance, ERP systems</li>
</ul>

<h3>2️⃣ Data Types in Oracle</h3>
<ul>
  <li>NUMBER – numeric values</li>
  <li>VARCHAR2 – variable length string</li>
  <li>CHAR – fixed length string</li>
  <li>DATE – date & time</li>
  <li>CLOB / BLOB – large objects</li>
</ul>

<hr>

<h3>3️⃣ Create Table Program</h3>

<pre>
CREATE TABLE employees (
  emp_id NUMBER PRIMARY KEY,
  name VARCHAR2(50),
  salary NUMBER,
  department VARCHAR2(30)
);
</pre>

<b>Output:</b>  
Table created.

<hr>

<h3>4️⃣ Insert Data Program</h3>

<pre>

</pre>

<b>Output:</b>  
3 rows inserted.

<h3>5️⃣ Select Program</h3>

<pre>

<pre>

<h3>6️⃣ WHERE Clause Program</h3>

<pre>

</pre>

<pre>
NAME | SALARY
------------
John | 30000
Amit | 35000
</pre>

<hr>

<h3>7️⃣ ORDER BY Program</h3>

<pre>

</pre>

103 | Amit | 35000 | IT
101 | John | 30000 | IT
</pre>

<h3>8️⃣ Aggregate Functions</h3>

IT | 2

</pre>

<pre>
BEGIN

<pre>
Welcome to Oracle PL/SQL

<h3>1️⃣1️⃣ PL/SQL Variables Program</h3>

<pre>

  v_name VARCHAR2(30) := 'John';

END;
/

High Salary
</pre>

<h3>1️⃣3️⃣ Loop Program</h3>

<pre>

2

<h2 style="color:#0a7cff;">DBMS (Database Management System) – Complete Guide</h2>

<p style="font-size:16px;line-height:1.9;">
A <b>DBMS</b> is software that allows users to <b>store, retrieve, update, and manage data</b> efficiently.
It acts as an interface between users and databases.
</p>

<hr>

<h3>1️⃣ What is DBMS?</h3>
<ul>
  <li>Stores data in structured format</li>
  <li>Reduces data redundancy</li>
  <li>Provides data security</li>
  <li>Supports multiple users</li>
  <li>Ensures data consistency</li>
</ul>

<hr>

<h3>2️⃣ DBMS Examples</h3>
<ul>
  <li>MySQL</li>
  <li>Oracle</li>
  <li>SQL Server</li>
  <li>PostgreSQL</li>
  <li>MongoDB</li>
</ul>

<hr>

<h3>3️⃣ Types of Databases</h3>
<ul>
  <li><b>Hierarchical DB</b> – Tree structure</li>
  <li><b>Network DB</b> – Graph structure</li>
  <li><b>Relational DB</b> – Tables (Rows & Columns)</li>
  <li><b>Object-Oriented DB</b> – Objects & Classes</li>
  <li><b>NoSQL DB</b> – Document / Key-value</li>
</ul>

<hr>

<h3>4️⃣ DBMS Architecture</h3>
<ul>
  <li><b>1-Tier:</b> Database directly used by user</li>
  <li><b>2-Tier:</b> Client ↔ Database</li>
  <li><b>3-Tier:</b> Client ↔ Server ↔ Database</li>
</ul>

<hr>

<h3>5️⃣ Keys in DBMS</h3>
<ul>
  <li><b>Primary Key</b> – Unique identifier</li>
  <li><b>Foreign Key</b> – Links two tables</li>
  <li><b>Candidate Key</b> – Possible primary key</li>
  <li><b>Composite Key</b> – Multiple columns</li>
  <li><b>Super Key</b> – Unique attribute set</li>
</ul>

<hr>

<h3>6️⃣ Constraints (DBMS Rules)</h3>
<ul>
  <li>NOT NULL</li>
  <li>UNIQUE</li>
  <li>PRIMARY KEY</li>
  <li>FOREIGN KEY</li>
  <li>CHECK</li>
  <li>DEFAULT</li>
</ul>

<hr>

<h3>7️⃣ Create Table Program</h3>

<pre>
CREATE TABLE student (
  id INT PRIMARY KEY,
  name VARCHAR(50),
  age INT,
  course VARCHAR(30)
);
</pre>

<b>Output:</b>  
Table created.

<hr>

<h3>8️⃣ Insert Data Program</h3>

<pre>

INSERT INTO student VALUES (2, 'Anita', 21, 'BCA');
INSERT INTO student VALUES (3, 'Suresh', 22, 'B.Sc');
</pre>

<b>Output:</b>  
3 rows inserted.

<hr>

<h3>9️⃣ Select Program</h3>

<pre>
SELECT * FROM student;
</pre>

<b>Output:</b>

<pre>
ID | NAME   | AGE | COURSE
--------------------------
1  | Ravi   | 20  | B.Tech
2  | Anita  | 21  | BCA
3  | Suresh | 22  | B.Sc
</pre>

<hr>

<h3>🔟 WHERE Clause Program</h3>

<pre>
SELECT name, course FROM student WHERE age > 20;
</pre>

<b>Output:</b>

<pre>
Anita  | BCA
Suresh | B.Sc
</pre>

<hr>

<h3>1️⃣1️⃣ Update Program</h3>

<pre>
UPDATE student SET course = 'MCA' WHERE id = 2;
</pre>

<b>Output:</b>  
1 row updated.

<hr>

<h3>1️⃣2️⃣ Delete Program</h3>

<pre>
DELETE FROM student WHERE id = 3;
</pre>

<b>Output:</b>  
1 row deleted.

<hr>

<h3>1️⃣3️⃣ Joins in DBMS</h3>

<ul>
  <li>INNER JOIN</li>
  <li>LEFT JOIN</li>
  <li>RIGHT JOIN</li>
  <li>FULL JOIN</li>
</ul>

<h4>JOIN Program</h4>

<pre>
SELECT student.name, course.course_name
FROM student
INNER JOIN course
ON student.id = course.sid;
</pre>

<b>Output:</b>  
Combined records from both tables.

<hr>

<h3>1️⃣4️⃣ Normalization</h3>
<ul>
  <li><b>1NF:</b> Atomic values</li>
  <li><b>2NF:</b> No partial dependency</li>
  <li><b>3NF:</b> No transitive dependency</li>
</ul>

<hr>

<h3>1️⃣5️⃣ ACID Properties</h3>
<ul>
  <li><b>Atomicity:</b> All or nothing</li>
  <li><b>Consistency:</b> Valid state</li>
  <li><b>Isolation:</b> Transactions independent</li>
  <li><b>Durability:</b> Permanent changes</li>
</ul>

<hr>

<h3>1️⃣6️⃣ Advantages of DBMS</h3>
<ul>
  <li>Data security</li>
  <li>Data sharing</li>
  <li>Backup & recovery</li>
  <li>Reduced redundancy</li>
  <li>Integrity & consistency</li>
</ul>
