<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edumate Magic Black</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <style>
        :root {
            --bg-black: #000000;
            --magic-glow: #bb86fc;
            --magic-purple: #6200ee;
            --card-bg: #121212;
            --border: rgba(187, 134, 252, 0.3);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100dvh; /* Full screen height fix */
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-black);
            color: white;
            overflow: hidden;
        }

        #main-view { display: flex; flex-direction: column; height: 100%; }

        header {
            padding: 20px;
            text-align: center;
            background: #0a0a0a;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 0 15px rgba(187, 134, 252, 0.2);
        }

        .title { 
            font-weight: 800; 
            font-size: 22px; 
            letter-spacing: 2px;
            color: var(--magic-glow);
            text-shadow: 0 0 10px var(--magic-glow);
        }

        #notesList {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            scrollbar-width: none;
        }

        /* --- Main Page Card with Delete --- */
        .noteItem {
            background: var(--card-bg);
            margin-bottom: 12px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .noteInfo { flex: 1; cursor: pointer; }
        .noteItem h3 { margin: 0; font-size: 18px; color: #fff; }
        .noteItem small { color: #777; font-size: 11px; display: block; margin-top: 5px; }

        .del-btn-main {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
        }

        #addBtn {
            position: fixed; bottom: 30px; right: 25px;
            width: 65px; height: 65px; border-radius: 50%;
            background: var(--magic-purple); color: white; border: none;
            font-size: 35px; box-shadow: 0 0 20px var(--magic-purple);
            z-index: 10;
        }

        /* --- Full Screen Editor --- */
        #editor {
            position: fixed;
            inset: 0;
            width: 100%; height: 100dvh; /* Ensures full black background */
            background: var(--bg-black);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0a0a0a;
            border-bottom: 1px solid var(--border);
        }

        .editor-content { 
            flex: 1; /* Makes the writing area fill the screen */
            display: flex; 
            flex-direction: column; 
            padding: 25px; 
        }

        #titleInput {
            background: transparent; border: none; color: white;
            font-size: 26px; font-weight: bold; border-bottom: 1px solid var(--border);
            padding-bottom: 10px; outline: none;
        }

        #contentInput { 
            flex: 1; /* Magic Full-Screen expansion */
            background: transparent; border: none; color: #bbb;
            font-size: 19px; resize: none; outline: none; line-height: 1.6;
            margin-top: 15px;
        }

        .save-btn { background: var(--magic-glow); color: black; font-weight: bold; border: none; padding: 10px 20px; border-radius: 10px; }
        .back-btn { background: none; border: none; color: #888; font-weight: bold; }

    </style>
</head>
<body>

<div id="main-view">
    <header><span class="title">✨ EDUMATE</span></header>
    <div id="notesList"></div>
    <button id="addBtn" onclick="openEditor()">+</button>
</div>

<div id="editor">
    <div class="editor-header">
        <button class="back-btn" onclick="closeEditor()">DISCARD</button>
        <span class="title" style="font-size: 16px;">🔮 Magic Note</span>
        <button class="save-btn" onclick="saveNote()">SAVE</button>
    </div>
    <div class="editor-content">
        <input type="text" id="titleInput" placeholder="Note Title...">
        <textarea id="contentInput" placeholder="Write your cosmic thoughts here..."></textarea>
    </div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem("magic_black_notes")) || [];
    let editIndex = null;

    function renderNotes() {
        const list = document.getElementById("notesList");
        list.innerHTML = notes.length ? "" : "<p style='text-align:center; opacity:0.2; margin-top:50px;'>The void is empty...</p>";
        
        notes.forEach((note, index) => {
            const div = document.createElement("div");
            div.className = "noteItem";
            div.innerHTML = `
                <div class="noteInfo" onclick="openEditor(${index})">
                    <h3>${note.title}</h3>
                    <small>✦ ${note.date}</small>
                </div>
                <button class="del-btn-main" onclick="deleteNote(${index})">DELETE</button>
            `;
            list.appendChild(div);
        });
    }

    function openEditor(index = null) {
        document.getElementById("editor").style.display = "flex";
        if (index !== null) {
            editIndex = index;
            document.getElementById("titleInput").value = notes[index].title;
            document.getElementById("contentInput").value = notes[index].content;
        } else {
            editIndex = null;
            document.getElementById("titleInput").value = "";
            document.getElementById("contentInput").value = "";
        }
    }

    function closeEditor() { document.getElementById("editor").style.display = "none"; }

    function saveNote() {
        const title = document.getElementById("titleInput").value.trim();
        const content = document.getElementById("contentInput").value.trim();
        if (!title || !content) return;

        const data = { 
            title, 
            content, 
            date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
        };
        
        if (editIndex !== null) notes[editIndex] = data;
        else notes.unshift(data);

        saveData();
        closeEditor();
    }

    function deleteNote(index) {
        if (confirm("Delete this magic note?")) {
            notes.splice(index, 1);
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem("magic_black_notes", JSON.stringify(notes));
        renderNotes();
    }

    renderNotes();
</script>
</body>
</html>
