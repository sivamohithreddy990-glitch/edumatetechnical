<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IIT Aptitude Magic App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{ --glow:#00f7ff; }
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top,#0f2027,#000);
  color:#fff;
  min-height:100vh;
}

.page{
  display:none;
  padding:20px;
  animation:fade .4s ease;
  position:relative;
}
.page.active{display:block;}

@keyframes fade{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

h2{
  text-align:center;
  margin:40px 0 25px;
}

/* BACK BUTTON */
.backTop{
  position:absolute;
  top:15px;
  left:15px;
  background:rgba(255,255,255,0.15);
  padding:8px 14px;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,247,255,.4);
  z-index: 10;
}

/* HOME CIRCLES */
.circles{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:30px;
  flex-wrap:wrap;
}

.circle{
  width:140px;
  height:140px;
  border-radius:50%;
  background:linear-gradient(145deg,#0d0d0d,#050505);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:26px;
  cursor:pointer;
  box-shadow:0 0 18px rgba(0,247,255,.35);
  transition:.3s;
}
.circle span{font-size:13px;margin-top:6px;}
.circle:hover{transform:scale(1.08);}

/* CARDS */
.card{
  background:rgba(255,255,255,.06);
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 0 18px rgba(0,247,255,.15);
}

.progress-banner {
    background: rgba(0, 247, 255, 0.1);
    border: 1px dashed var(--glow);
    padding: 8px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 13px;
}

/* BUTTON */
.btn,.nextNoteBtn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#00f7ff,#0077ff);
  color:#000;
  font-weight:bold;
  font-size:15px;
  margin-top:15px;
  cursor:pointer;
}

/* OPTIONS */
.option{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.2);
  cursor:pointer;
}
.option.correct{background:#064e3b !important; border-color: var(--glow);}
.option.wrong{background:#7f1d1d !important;}

/* EXPLANATION */
.explain-card{
  background:rgba(0,0,0,.45);
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  border-left: 4px solid var(--glow);
}
</style>
</head>

<body>

<div class="page active" id="home">
  <h2>✨ IIT Aptitude ✨</h2>
  <div class="circles">
    <div class="circle" onclick="openP('videos')">🎥<span>Videos</span></div>
    <div class="circle" onclick="openP('test')">🧠<span>Test</span></div>
    <div class="circle" onclick="openP('notes')">📘<span>Notes</span></div>

</div>

<div class="page" id="videos">

</div>

<div class="page" id="test">

  <div id="qBox"></div>
  <div id="expBox"></div>
  <button class="btn" id="nextBtn" onclick="nextQ()" style="display:none;">Next Question</button>
</div>

<div class="page" id="result">
  <div class="backTop" onclick="openP('home')">⬅ Back</div>
  <h2>🎉 Result</h2>
  <div class="card" id="scoreCard"></div>
  <button class="btn" onclick="restartTest()">Restart From Beginning</button>
</div>

<div class="page" id="notes">
  <div class="backTop" onclick="openP('home')">⬅ Back</div>
  <h2>📘 Notes</h2>
  <div class="card" id="noteArea"></div>
  <button class="nextNoteBtn" onclick="nextNote()">Next ➜</button>
</div>

/* ---------- TEST LOGIC ---------- */
function resumeTest() {
    const saved = localStorage.getItem('aptitude_progress');
    i = saved ? parseInt(saved) : 0;
    if(i >= qs.length) i = 0;
    loadQ();
}

function loadQ(){
  answered = false;
  localStorage.setItem('aptitude_progress', i);
  
  let q = qs[i];
  let html = `<div class='card'><b>Q${i+1}. ${q.q}</b>`;
  q.o.forEach((op,ix)=>{
    html += `<div class='option' onclick='chk(${ix},this)'>${op}</div>`;
  });
  html += `</div>`;
  
  document.getElementById('progBar').innerText = `Progress: Question ${i+1} of ${qs.length}`;
  document.getElementById('qBox').innerHTML = html;
  document.getElementById('expBox').innerHTML = "";
  document.getElementById('nextBtn').style.display = "none";
}

function chk(s, el){
  if(answered) return;
  answered = true;
  
  let q = qs[i];
  let options = document.querySelectorAll(".option");
  
  if(s === q.a){ 
      el.classList.add("correct"); 
      score++; 
  } else {
      el.classList.add("wrong");
      options[q.a].classList.add("correct");
  }
  
  document.getElementById('expBox').innerHTML = `<div class='explain-card'><b>Explanation:</b> ${q.exp}</div>`;
  document.getElementById('nextBtn').style.display = "block";
}

function nextQ(){
  if(i < qs.length-1){ 
      i++; 
      loadQ(); 
  } else {
      openP("result");
      document.getElementById('scoreCard').innerHTML = `<h3>Final Score: ${score}/${qs.length}</h3><p>You have completed the entire set!</p>`;
  }
}

function restartTest(){ 
    i = 0; 
    score = 0; 
    localStorage.removeItem('aptitude_progress');
    openP("test"); 
    loadQ(); 
}
